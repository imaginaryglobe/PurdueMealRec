<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purdue Meal Rec</title>
  <meta name="description"
    content="The most protein-efficient foods at Purdue dining courts, ranked by calories per gram of protein.">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page">
    <!-- Masthead -->
    <header class="masthead">
      <div class="masthead-top">
        <div class="brand">
          <h1 class="title">Purdue Meal Rec</h1>
        </div>
        <div class="masthead-tools">
          <input type="date" id="menu-date" class="date-input" aria-label="Menu date">
          <button class="ghost-btn" id="refresh-btn" title="Refresh data">Refresh</button>
          <button class="ghost-btn icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">☾</button>
        </div>
      </div>
    </header>

    <!-- View switch -->
    <nav class="view-tabs" id="view-tabs" aria-label="View">
      <button class="view-tab active" data-view="today">Today</button>
      <button class="view-tab" data-view="week">Week</button>
    </nav>

    <!-- Controls -->
    <nav class="controls" aria-label="Filters">
      <div class="control-row" id="court-filters">
        <button class="tab active" data-court="all">All courts</button>
        <button class="tab" data-court="earhart"><span class="court-dot court-earhart"></span>Earhart</button>
        <button class="tab" data-court="ford"><span class="court-dot court-ford"></span>Ford</button>
        <button class="tab" data-court="hillenbrand"><span class="court-dot court-hillenbrand"></span>Hillenbrand</button>
        <button class="tab" data-court="wiley"><span class="court-dot court-wiley"></span>Wiley</button>
        <button class="tab" data-court="windsor"><span class="court-dot court-windsor"></span>Windsor</button>
      </div>
      <div class="control-row split">
        <div class="control-group" id="meal-filters">
          <button class="tab active" data-meal="lunch">Lunch</button>
          <button class="tab" data-meal="dinner">Dinner</button>
        </div>
        <div class="control-group" id="sort-filters">
          <button class="tab active" data-sort="protein">Protein</button>
          <button class="tab" data-sort="fiber">Fiber</button>
        </div>
      </div>
    </nav>

    <p class="week-key" id="week-key" hidden>🐄 beef · 🐔 chicken in Earhart's MYO stir fry</p>

    <div class="hidden-foods" id="hidden-foods" hidden>
      <button class="text-link" id="hidden-toggle">0 hidden</button>
      <ul class="hidden-list" id="hidden-list" hidden></ul>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <ol class="ranking skeleton-list">
        <li class="rank-row skeleton"><span class="sk sk-num"></span>
          <span class="sk-body"><span class="sk sk-line wide"></span><span class="sk sk-line narrow"></span></span>
          <span class="sk sk-ratio"></span>
        </li>
        <li class="rank-row skeleton"><span class="sk sk-num"></span>
          <span class="sk-body"><span class="sk sk-line wide"></span><span class="sk sk-line narrow"></span></span>
          <span class="sk sk-ratio"></span>
        </li>
        <li class="rank-row skeleton"><span class="sk sk-num"></span>
          <span class="sk-body"><span class="sk sk-line wide"></span><span class="sk sk-line narrow"></span></span>
          <span class="sk sk-ratio"></span>
        </li>
        <li class="rank-row skeleton"><span class="sk sk-num"></span>
          <span class="sk-body"><span class="sk sk-line wide"></span><span class="sk sk-line narrow"></span></span>
          <span class="sk sk-ratio"></span>
        </li>
      </ol>
    </div>

    <!-- Error -->
    <div class="state error" id="error" hidden>
      <p id="error-message">Something went wrong.</p>
      <button class="text-link" onclick="fetchData()">Try again</button>
    </div>

    <!-- Empty -->
    <div class="state empty" id="empty-state" hidden>
      <p>No foods match this selection.</p>
    </div>

    <!-- Ranking -->
    <main id="today-view">
      <ol class="ranking" id="food-list"></ol>
    </main>

    <!-- Week -->
    <section id="week-view" hidden>
      <div class="week-grid" id="week-grid"></div>
    </section>

    <footer class="colophon">
      <span id="meta-line">Ranked by calories per gram of protein · lower is better.</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>

</html>
